<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Test</title>
  <style>
    /* İframe'i şeffaf ve tam ekran olarak ayarla */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: transparent;
    }

    /* Iframe yerleşimi */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background-color: transparent;
    }

    #gift-box {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      color: white;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
      visibility: hidden; /* Başlangıçta gizle */
    }
  </style>
</head>

<body>
  <div id="gift-box"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gift = urlParams.get('gift');

    if (gift) {
      const box = document.getElementById('gift-box');
      box.innerText = `🎁 Hediye Geldi: ${gift}`;

      // Hediye geldiğinde görünür yap
      box.style.visibility = 'visible';

      // 5 saniye sonra gizle
      setTimeout(() => {
        box.style.visibility = 'hidden';
      }, 5000); // 5000 ms = 5 saniye
    }
  </script>
</body>

</html>
