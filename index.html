<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Test</title>
    <style>
        /* Sayfa ve iframe ayarları */
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent; /* Şeffaf arka plan */
            width: 100%;
            height: 100%;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }

        /* Hediye kutusu stil */
        #gift-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: white;
            z-index: 10000; /* Yüksek z-index, üstte görünmesi için */
            text-align: center;
            display: none; /* Başlangıçta gizli */
        }
    </style>
</head>

<body>
    <!-- Hediye kutusunu ekliyoruz -->
    <div id="gift-box"></div>
    <!-- Iframe ile dışarıdan gelen URL'yi yerleştir -->
    <iframe src="https://d27cc56c-e5b6-4b98-aedf-5df6b024019f-00-1lm32ot3lfdez.sisko.replit.dev"
        allow="autoplay; encrypted-media"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gift = urlParams.get('gift');

        if (gift) {
            const box = document.getElementById('gift-box');
            box.innerText = `🎁 Hediye Geldi: ${gift}`;
            box.style.display = 'block'; // Hediye kutusunu göster

            // 5 saniye sonra kutuyu gizle
            setTimeout(() => {
                box.style.display = 'none'; // Kutuyu gizle
            }, 5000);

            // Alternatif olarak, yazıyı 5 saniye sonra boşaltabilirsin
            // setTimeout(() => {
            //     box.innerText = ''; // Yazıyı temizle
            // }, 5000);
        }
    </script>
</body>

</html>
