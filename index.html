<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      overflow: hidden;
    }
    #gift-box {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 24px;
      padding: 10px 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="gift-box" style="display: none;"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gift = urlParams.get("gift");

    if (gift) {
      const box = document.getElementById("gift-box");
      box.innerText = `🎁 ${gift}`;
      box.style.display = "block";

      setTimeout(() => {
        box.style.display = "none";
      }, 5000);
    }
  </script>
</body>
</html>
