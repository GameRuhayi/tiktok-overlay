<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Test</title>
    <style>
        /* Sayfa ve iframe ayarları */
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }

        #gift-box {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            display: none; /* Başlangıçta gizli */
            z-index: 10000;
        }
    </style>
</head>
<body>
    <!-- Hediye kutusunu ekliyoruz -->
    <div id="gift-box"></div>

    <!-- Iframe ile dışarıdan gelen URL'yi yerleştir -->
    <iframe src="https://d27cc56c-e5b6-4b98-aedf-5df6b024019f-00-1lm32ot3lfdez.sisko.replit.dev"
        allow="autoplay; encrypted-media"></iframe>

    <script>
        // URL parametrelerini alıyoruz
        const urlParams = new URLSearchParams(window.location.search);
        const gift = urlParams.get('gift'); // URL'deki 'gift' parametresini alıyoruz

        if (gift) {
            const box = document.getElementById('gift-box');
            box.innerText = `🎁 Hediye Geldi: ${gift}`;
            box.style.display = 'block'; // Hediye kutusunu göster

            // 5 saniye sonra kutuyu gizle
            setTimeout(() => {
                box.style.display = 'none';
            }, 5000); // 5 saniye sonra kutu kaybolur
        }

        // TikTok Live Studio URL parametresi değiştiğinde güncelleme
        // Ekranda görünen mesajı dinamik olarak günceller
        window.addEventListener("hashchange", function() {
            const newGift = new URLSearchParams(window.location.search).get('gift');
            if (newGift) {
                const box = document.getElementById('gift-box');
                box.innerText = `🎁 Yeni Hediye: ${newGift}`;
                box.style.display = 'block';
                setTimeout(() => {
                    box.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
