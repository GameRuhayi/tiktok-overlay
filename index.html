<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Test</title>
  <style>
    /* İframe'i şeffaf ve tam ekran olarak ayarla */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: transparent;
    }

    /* Iframe yerleşimi */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      /* Iframe kenarlığını kaldır */
      background-color: transparent;
    }

    /* Hediye kutusunun stilini ayarla */
    #gift-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2em;
      color: white;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>
  <!-- Hediye kutusu -->
  <div id="gift-box"></div>

  <!-- Iframe ile dışarıdan gelen URL'yi yerleştir -->
  <iframe src="https://d27cc56c-e5b6-4b98-aedf-5df6b024019f-00-1lm32ot3lfdez.sisko.replit.dev"
    allow="autoplay; encrypted-media" />
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const gift = urlParams.get('gift');

    if (gift) {
      const box = document.getElementById('gift-box');
      box.innerText = `🎁 Hediye Geldi: ${gift}`;
      box.style.display = 'block';  // Hediye kutusunu göster

      // 5 saniye sonra gizle
      setTimeout(() => {
        box.style.display = 'none';  // Hediye kutusunu gizle
      }, 5000);  // 5000 ms = 5 saniye
    }
  </script>

</body>

</html>
